<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Học HSK3 - Tiếng Trung</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px;
}

.header{
    background:linear-gradient(135deg,#1677ff,#005bea);
    color:white;
    border-radius:18px;
    padding:22px 18px;
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:7px 0 0;
    opacity:.9;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:15px;
}

.menu button{
    border:none;
    background:white;
    color:#333;
    border-radius:12px;
    padding:13px 5px;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.menu button.active{
    background:#1677ff;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:15px;
}

.stat{
    background:white;
    border-radius:12px;
    padding:10px 5px;
    text-align:center;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.stat strong{
    display:block;
    font-size:19px;
}

.stat span{
    font-size:11px;
    color:#777;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px 18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.mode-title{
    text-align:center;
    font-size:14px;
    color:#777;
    margin-bottom:12px;
}

.question{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin:20px 0;
    min-height:45px;
}

.question.vi{
    font-size:27px;
}

.question.hanzi{
    font-size:42px;
}

.pinyin{
    text-align:center;
    font-size:22px;
    color:#1677ff;
    margin:12px 0;
    min-height:30px;
}

.example{
    background:#f4f7fb;
    border-radius:12px;
    padding:13px;
    margin:15px 0;
    text-align:center;
}

.example .han{
    font-size:25px;
    font-weight:bold;
}

.example .py{
    color:#1677ff;
    margin-top:5px;
}

.example .meaning{
    color:#666;
    margin-top:5px;
}

input{
    width:100%;
    padding:15px;
    font-size:21px;
    border:2px solid #ddd;
    border-radius:12px;
    outline:none;
    text-align:center;
    margin-top:10px;
}

input:focus{
    border-color:#1677ff;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.actions button,
.bottom-buttons button{
    border:none;
    border-radius:12px;
    padding:14px 10px;
    font-size:16px;
    font-weight:bold;
}

.check{
    background:#1677ff;
    color:white;
}

.next{
    background:#20a464;
    color:white;
}

.bottom-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:10px;
}

.shuffle{
    background:#f0f2f5;
    color:#333;
}

.reset{
    background:#ffecec;
    color:#d93025;
}

.result{
    text-align:center;
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    display:none;
}

.correct{
    display:block;
    background:#e8f7ee;
    color:#16803d;
}

.wrong{
    display:block;
    background:#fff0f0;
    color:#d93025;
}

.hint{
    display:block;
    background:#fff8df;
    color:#856404;
}

.answer{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
}

.progress{
    height:7px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#1677ff;
    transition:.3s;
}

.info{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:15px;
}

.footer{
    text-align:center;
    color:#999;
    font-size:12px;
    margin:20px 0;
}

.hidden{
    display:none !important;
}

@media(max-width:430px){
    .container{
        padding:10px;
    }

    .header{
        padding:18px 12px;
    }

    .header h1{
        font-size:22px;
    }

    .question.hanzi{
        font-size:38px;
    }

    .question.vi{
        font-size:24px;
    }

    .stats{
        gap:5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🇨🇳 HỌC TIẾNG TRUNG HSK3</h1>
        <p>Luyện từ vựng • chữ Hán • câu</p>
    </div>

    <div class="menu">
        <button id="modeWrite" class="active" onclick="changeMode('write')">
            🀄<br>Luyện viết
        </button>

        <button id="modeVocab" onclick="changeMode('vocab')">
            📚<br>Từ vựng
        </button>

        <button id="modeSentence" onclick="changeMode('sentence')">
            💬<br>Luyện câu
        </button>
    </div>

    <div class="stats">
        <div class="stat">
            <strong id="correctCount">0</strong>
            <span>Đúng</span>
        </div>

        <div class="stat">
            <strong id="wrongCount">0</strong>
            <span>Sai</span>
        </div>

        <div class="stat">
            <strong id="totalCount">0</strong>
            <span>Đã làm</span>
        </div>

        <div class="stat">
            <strong id="score">0%</strong>
            <span>Tỷ lệ</span>
        </div>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="card">

        <div class="mode-title" id="modeTitle">
            LUYỆN VIẾT CHỮ HÁN
        </div>

        <div class="question vi" id="question">
            yêu thích
        </div>

        <div class="pinyin hidden" id="pinyin"></div>

        <input
            type="text"
            id="answerInput"
            placeholder="Nhập câu trả lời..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done">

        <div class="actions">
            <button class="check" onclick="checkAnswer()">
                ✓ Kiểm tra
            </button>

            <button class="next" onclick="nextQuestion()">
                → Câu tiếp
            </button>
        </div>

        <div id="result" class="result"></div>

        <div id="example" class="example hidden">
            <div class="han" id="exampleHan"></div>
            <div class="py" id="examplePy"></div>
            <div class="meaning" id="exampleMeaning"></div>
        </div>

        <div class="bottom-buttons">
            <button class="shuffle" onclick="shuffleCurrentMode()">
                🔀 Xáo trộn
            </button>

            <button class="reset" onclick="resetAll()">
                ↻ Làm lại
            </button>
        </div>

        <div class="info" id="info">
            Sai 3 lần sẽ hiện Pinyin gợi ý.
        </div>

    </div>

    <div class="footer">
        HSK3 Chinese Practice
    </div>

</div>

/* =========================================================
   BIẾN
========================================================= */

let currentMode = "write";

let currentIndex = 0;

let currentData = [];

let wrongAttempts = 0;

let finished = false;

let correctCount = 0;

let wrongCount = 0;

let totalCount = 0;


/* =========================================================
   KHỞI TẠO
========================================================= */

function init(){

    currentData = [...vocabulary];

    showQuestion();

    updateStats();

}


/* =========================================================
   ĐỔI CHẾ ĐỘ
========================================================= */

function changeMode(mode){

    currentMode = mode;

    currentIndex = 0;

    wrongAttempts = 0;

    finished = false;

    if(mode === "write"){

        currentData = [...vocabulary];

        document.getElementById("modeTitle").textContent =
            "LUYỆN VIẾT CHỮ HÁN";

        document.getElementById("info").textContent =
            "Sai 3 lần sẽ hiện Pinyin gợi ý.";

    }

    else if(mode === "vocab"){

        currentData = [...vocabulary];

        document.getElementById("modeTitle").textContent =
            "LUYỆN TỪ VỰNG";

        document.getElementById("info").textContent =
            "Nhìn chữ Hán và nhập nghĩa tiếng Việt.";

    }

    else{

        currentData = [...sentences];

        document.getElementById("modeTitle").textContent =
            "LUYỆN CÂU";

        document.getElementById("info").textContent =
            "Dịch câu tiếng Việt sang tiếng Trung.";

    }

    document.getElementById("modeWrite").classList.remove("active");
    document.getElementById("modeVocab").classList.remove("active");
    document.getElementById("modeSentence").classList.remove("active");

    if(mode === "write"){
        document.getElementById("modeWrite").classList.add("active");
    }

    if(mode === "vocab"){
        document.getElementById("modeVocab").classList.add("active");
    }

    if(mode === "sentence"){
        document.getElementById("modeSentence").classList.add("active");
    }

    showQuestion();

}


/* =========================================================
   HIỂN THỊ CÂU HỎI
========================================================= */

function showQuestion(){

    const item = currentData[currentIndex];

    wrongAttempts = 0;

    finished = false;

    const question = document.getElementById("question");

    const pinyin = document.getElementById("pinyin");

    const input = document.getElementById("answerInput");

    const result = document.getElementById("result");

    const example = document.getElementById("example");

    input.value = "";

    input.blur();

    pinyin.textContent = "";

    pinyin.classList.add("hidden");

    result.textContent = "";

    result.className = "result";

    example.classList.add("hidden");

    if(currentMode === "write"){

        question.textContent = item.vi;

        question.className = "question vi";

        input.placeholder = "Nhập chữ Hán...";

    }

    else if(currentMode === "vocab"){

        question.textContent = item.han;

        question.className = "question hanzi";

        input.placeholder = "Nhập nghĩa tiếng Việt...";

    }

    else{

        question.textContent = item.vi;

        question.className = "question vi";

        input.placeholder = "Nhập câu tiếng Trung...";

    }

    updateProgress();

}


/* =========================================================
   LÀM SẠCH CÂU TRẢ LỜI
========================================================= */

function cleanText(text){

    return text
        .trim()
        .replace(/\s+/g,"")
        .replace(/[。！？!?，,.、]/g,"")
        .toLowerCase();

}


/* =========================================================
   KIỂM TRA
========================================================= */

function checkAnswer(){

    if(finished) return;

    const input = document.getElementById("answerInput");

    const userAnswer = cleanText(input.value);

    if(!userAnswer){

        showResult("⚠️ Hãy nhập câu trả lời.", "hint");

        return;

    }

    const item = currentData[currentIndex];

    let correctAnswer = "";

    let displayAnswer = "";

    if(currentMode === "write"){

        correctAnswer = cleanText(item.han);

        displayAnswer = item.han;

    }

    else if(currentMode === "vocab"){

        correctAnswer = cleanText(item.vi);

        displayAnswer = item.vi;

    }

    else{

        correctAnswer = cleanText(item.han);

        displayAnswer = item.han;

    }

    if(userAnswer === correctAnswer){

        correctCount++;

        totalCount++;

        finished = true;

        showResult(
            "✓ Chính xác!<div class='answer'>" +
            displayAnswer +
            "</div>",
            "correct"
        );

        showPinyin(item);

        if(currentMode === "sentence"){

            showExample(item);

        }

        input.blur();

    }

    else{

        wrongAttempts++;

        wrongCount++;

        totalCount++;

        if(wrongAttempts >= 3){

            finished = true;

            showResult(
                "✗ Đã sai 3 lần.<div class='answer'>" +
                displayAnswer +
                "</div>",
                "hint"
            );

            showPinyin(item);

            if(currentMode === "sentence"){

                showExample(item);

            }

            input.blur();

        }

        else{

            showResult(
                "✗ Chưa đúng. Thử lại lần " +
                (wrongAttempts + 1),
                "wrong"
            );

        }

    }

    updateStats();

}


/* =========================================================
   HIỆN PINYIN
========================================================= */

function showPinyin(item){

    const pinyin = document.getElementById("pinyin");

    pinyin.textContent = item.py;

    pinyin.classList.remove("hidden");

}


/* =========================================================
   HIỆN CÂU MẪU
========================================================= */

function showExample(item){

    const example = document.getElementById("example");

    document.getElementById("exampleHan").textContent =
        item.han;

    document.getElementById("examplePy").textContent =
        item.py;

    document.getElementById("exampleMeaning").textContent =
        item.vi;

    example.classList.remove("hidden");

}


/* =========================================================
   RESULT
========================================================= */

function showResult(text,type){

    const result = document.getElementById("result");

    result.innerHTML = text;

    result.className = "result " + type;

}


/* =========================================================
   CÂU TIẾP
========================================================= */

function nextQuestion(){

    currentIndex++;

    if(currentIndex >= currentData.length){

        currentIndex = 0;

        showResult(
            "🎉 Bạn đã hoàn thành một vòng!",
            "correct"
        );

    }

    showQuestion();

}


/* =========================================================
   XÁO TRỘN
========================================================= */

function shuffleArray(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]] =
        [array[j],array[i]];

    }

}


function shuffleCurrentMode(){

    shuffleArray(currentData);

    currentIndex = 0;

    showQuestion();

}


/* =========================================================
   RESET
========================================================= */

function resetAll(){

    correctCount = 0;

    wrongCount = 0;

    totalCount = 0;

    currentIndex = 0;

    wrongAttempts = 0;

    finished = false;

    if(currentMode === "sentence"){

        currentData = [...sentences];

    }

    else{

        currentData = [...vocabulary];

    }

    showQuestion();

    updateStats();

}


/* =========================================================
   THỐNG KÊ
========================================================= */

function updateStats(){

    document.getElementById("correctCount").textContent =
        correctCount;

    document.getElementById("wrongCount").textContent =
        wrongCount;

    document.getElementById("totalCount").textContent =
        totalCount;

    let percentage = 0;

    if(totalCount > 0){

        percentage =
            Math.round((correctCount / totalCount) * 100);

    }

    document.getElementById("score").textContent =
        percentage + "%";

}


/* =========================================================
   TIẾN ĐỘ
========================================================= */

function updateProgress(){

    const bar = document.getElementById("progressBar");

    if(currentData.length === 0){

        bar.style.width = "0%";

        return;

    }

    const percent =
        ((currentIndex + 1) / currentData.length) * 100;

    bar.style.width = percent + "%";

}


/* =========================================================
   ENTER ĐỂ KIỂM TRA
========================================================= */

document.getElementById("answerInput").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            checkAnswer();

        }

    }
);


/* =========================================================
   KHÔNG TỰ BẬT BÀN PHÍM
========================================================= */

window.addEventListener("load",function(){

    document.activeElement?.blur();

});


/* =========================================================
   START
========================================================= */

init();
