<!DOCTYPE html>
<html lang="vi">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Học Tiếng Trung HSK</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    background: #f3f5f7;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 15px;
}

.header {
    background: linear-gradient(135deg, #d71920, #f04444);
    color: white;
    border-radius: 18px;
    padding: 20px 15px;
    text-align: center;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 8px 0 0;
    opacity: .9;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.hidden {
    display: none !important;
}

/* =========================
   START SCREEN
========================= */

.name-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.name-input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.level-title {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

.level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
}

.level-btn {
    border: none;
    border-radius: 12px;
    padding: 18px 5px;
    background: #eee;
    font-size: 18px;
    font-weight: bold;
}

.level-btn.active {
    background: #d71920;
    color: white;
}

.start-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #198754;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* =========================
   TOP INFO
========================= */

.student-info {
    text-align: center;
    font-weight: bold;
    margin-bottom: 8px;
}

.current-level {
    text-align: center;
    color: #d71920;
    font-weight: bold;
    font-size: 20px;
}

/* =========================
   MENU
========================= */

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.menu button {
    border: none;
    background: #eee;
    border-radius: 10px;
    padding: 12px 5px;
    font-size: 14px;
}

.menu button.active {
    background: #d71920;
    color: white;
    font-weight: bold;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
}

.stat {
    background: #f4f4f4;
    border-radius: 10px;
    text-align: center;
    padding: 9px 2px;
}

.stat-number {
    font-size: 20px;
    font-weight: bold;
}

.stat-label {
    font-size: 11px;
    color: #666;
}

.progress-bg {
    height: 9px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #198754;
    transition: .3s;
}

/* =========================
   QUESTION
========================= */

.mode-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.question-type {
    text-align: center;
    color: #777;
    margin-top: 5px;
}

.question {
    text-align: center;
    font-size: 29px;
    font-weight: bold;
    margin: 25px 0;
    min-height: 45px;
}

.question-small {
    font-size: 22px;
}

.answer-input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 19px;
    text-align: center;
    outline: none;

    autocomplete: off;
}

.answer-input:focus {
    border-color: #d71920;
}

.action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.action-btn {
    padding: 14px;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: bold;
}

.check-btn {
    background: #198754;
    color: white;
}

.next-btn {
    background: #0d6efd;
    color: white;
}

.secondary-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #eee;
}

.result {
    text-align: center;
    margin-top: 15px;
    min-height: 28px;
    font-weight: bold;
}

.correct {
    color: #198754;
}

.wrong {
    color: #dc3545;
}

.answer-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #f5f5f5;
    text-align: center;
}

.pinyin {
    color: #555;
    font-style: italic;
    margin-top: 5px;
}

.example {
    margin-top: 10px;
    line-height: 1.6;
}

/* =========================
   BACK
========================= */

.back-btn {
    width: 100%;
    border: none;
    background: #444;
    color: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 420px) {

    .header h1 {
        font-size: 21px;
    }

    .question {
        font-size: 25px;
    }

    .menu button {
        font-size: 12px;
    }

    .stats {
        grid-template-columns: repeat(4, 1fr);
    }
}

</style>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">
        <h1>🇨🇳 HỌC TIẾNG TRUNG</h1>
        <p>HSK 1 • HSK 2 • HSK 3</p>
    </div>


    <!-- =========================
         START SCREEN
    ========================== -->

    <div id="startScreen" class="card">

        <div class="name-title">
            👤 Tên thí sinh
        </div>

        <input
            type="text"
            id="studentName"
            class="name-input"
            placeholder="Nhập tên của bạn..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="words"
            spellcheck="false"
        >

        <div class="level-title">
            📚 Chọn cấp độ muốn học
        </div>

        <div class="level-grid">

            <button
                class="level-btn"
                id="level1"
                onclick="selectLevel(1)">
                HSK 1
            </button>

            <button
                class="level-btn"
                id="level2"
                onclick="selectLevel(2)">
                HSK 2
            </button>

            <button
                class="level-btn"
                id="level3"
                onclick="selectLevel(3)">
                HSK 3
            </button>

        </div>

        <button class="start-btn" onclick="startLearning()">
            🚀 BẮT ĐẦU HỌC
        </button>

    </div>


    <!-- =========================
         LEARNING SCREEN
    ========================== -->

    <div id="learningScreen" class="hidden">

        <button class="back-btn" onclick="backToStart()">
            ← Đổi tên / đổi cấp độ
        </button>

        <div class="card">

            <div id="studentInfo" class="student-info"></div>

            <div id="currentLevel" class="current-level"></div>

        </div>


        <!-- MENU -->

        <div class="card">

            <div class="menu">

                <button
                    id="modeWrite"
                    onclick="changeMode('write')">
                    🀄 Luyện viết
                </button>

                <button
                    id="modeVocabulary"
                    onclick="changeMode('vocabulary')">
                    📚 Từ vựng
                </button>

                <button
                    id="modeSentence"
                    onclick="changeMode('sentence')">
                    💬 Luyện câu
                </button>

            </div>

        </div>


        <!-- STATS -->

        <div class="card">

            <div class="stats">

                <div class="stat">
                    <div id="correctCount" class="stat-number">0</div>
                    <div class="stat-label">Đúng</div>
                </div>

                <div class="stat">
                    <div id="wrongCount" class="stat-number">0</div>
                    <div class="stat-label">Sai</div>
                </div>

                <div class="stat">
                    <div id="totalCount" class="stat-number">0</div>
                    <div class="stat-label">Tổng</div>
                </div>

                <div class="stat">
                    <div id="percentCount" class="stat-number">0%</div>
                    <div class="stat-label">Đúng %</div>
                </div>

            </div>

            <div class="progress-bg">
                <div id="progressBar" class="progress"></div>
            </div>

        </div>


        <!-- QUESTION -->

        <div class="card">

            <div id="modeTitle" class="mode-title">
                🀄 LUYỆN VIẾT
            </div>

            <div id="questionType" class="question-type"></div>

            <div id="question" class="question"></div>

            <input
                type="text"
                id="answerInput"
                class="answer-input"
                placeholder="Nhập câu trả lời..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                enterkeyhint="done"
            >

            <div class="action-grid">

                <button
                    class="action-btn check-btn"
                    onclick="checkAnswer()">
                    ✓ KIỂM TRA
                </button>

                <button
                    class="action-btn next-btn"
                    onclick="nextQuestion()">
                    → CÂU TIẾP
                </button>

            </div>

            <button
                class="secondary-btn"
                onclick="showAnswer()">
                👁 Hiện đáp án
            </button>

            <div id="result" class="result"></div>

            <div id="answerBox" class="answer-box hidden"></div>

        </div>


        <div class="card">

            <button
                class="secondary-btn"
                onclick="shuffleCurrentMode()">
                🔀 Trộn câu hỏi
            </button>

            <button
                class="secondary-btn"
                onclick="resetStats()">
                ♻️ Xóa kết quả học
            </button>

        </div>

    </div>

</div>

function selectLevel(level) {

    selectedLevel = level;

    document.getElementById("level1").classList.remove("active");
    document.getElementById("level2").classList.remove("active");
    document.getElementById("level3").classList.remove("active");

    document.getElementById("level" + level).classList.add("active");

}


/* =====================================================
   5. BẮT ĐẦU HỌC
===================================================== */

function startLearning() {

    studentName = studentNameInput.value.trim();

    if (studentName === "") {

        alert("Vui lòng nhập tên thí sinh.");

        studentNameInput.focus();

        return;
    }

    if (selectedLevel === 0) {

        alert("Vui lòng chọn HSK1, HSK2 hoặc HSK3.");

        return;
    }

    localStorage.setItem(
        "hsk_student_name",
        studentName
    );

    localStorage.setItem(
        "hsk_level",
        selectedLevel
    );

    startScreen.classList.add("hidden");

    learningScreen.classList.remove("hidden");

    document.getElementById("studentInfo").textContent =
        "👤 " + studentName;

    document.getElementById("currentLevel").textContent =
        "HSK " + selectedLevel;

    resetStatsOnly();

    changeMode("write");

}


/* =====================================================
   6. QUAY LẠI
===================================================== */

function backToStart() {

    learningScreen.classList.add("hidden");

    startScreen.classList.remove("hidden");

    answerInput.blur();

}


/* =====================================================
   7. ĐỔI MODE
===================================================== */

function changeMode(mode) {

    currentMode = mode;

    currentIndex = 0;

    wrongAttempts = 0;

    answerInput.value = "";

    answerInput.blur();

    result.innerHTML = "";

    answerBox.classList.add("hidden");

    document.getElementById("modeWrite").classList.remove("active");
    document.getElementById("modeVocabulary").classList.remove("active");
    document.getElementById("modeSentence").classList.remove("active");

    if (mode === "write") {

        document.getElementById("modeWrite").classList.add("active");

        currentData =
            HSK_DATA[selectedLevel].vocabulary;

        document.getElementById("modeTitle").textContent =
            "🀄 LUYỆN VIẾT";

        document.getElementById("questionType").textContent =
            "Nhìn nghĩa tiếng Việt → viết chữ Hán";

    }

    else if (mode === "vocabulary") {

        document.getElementById("modeVocabulary").classList.add("active");

        currentData =
            getVocabularyForLevel();

        document.getElementById("modeTitle").textContent =
            "📚 LUYỆN TỪ VỰNG";

        document.getElementById("questionType").textContent =
            "Nhìn chữ Hán → nhập nghĩa tiếng Việt";

    }

    else if (mode === "sentence") {

        document.getElementById("modeSentence").classList.add("active");

        currentData =
            HSK_DATA[selectedLevel].sentences;

        document.getElementById("modeTitle").textContent =
            "💬 LUYỆN CÂU";

        document.getElementById("questionType").textContent =
            "Nhìn tiếng Việt → viết câu tiếng Trung";

    }

    shuffleArray(currentData);

    showQuestion();

}


/* =====================================================
   8. HSK3 ƯU TIÊN TỪ MỚI
===================================================== */

function getVocabularyForLevel() {

    const data =
        HSK_DATA[selectedLevel].vocabulary;

    if (selectedLevel !== 3) {

        return [...data];

    }

    const newWords =
        data.filter(item =>
            item.difficulty === "new"
        );

    const reviewWords =
        data.filter(item =>
            item.difficulty !== "new"
        );

    /*
       HSK3:
       80% ưu tiên từ mới
       20% từ ôn lại
    */

    let resultData = [];

    for (let item of newWords) {

        resultData.push(item);

    }

    /*
       Sau này khi có hàng trăm từ,
       thuật toán này sẽ được nâng cấp
       thành hệ thống chọn từ thông minh.
    */

    for (let item of reviewWords) {

        resultData.push(item);

    }

    return resultData;

}


/* =====================================================
   9. HIỂN THỊ CÂU HỎI
===================================================== */

function showQuestion() {

    if (!currentData.length) {

        question.textContent =
            "Chưa có dữ liệu.";

        return;
    }

    const item =
        currentData[currentIndex];

    answerInput.value = "";

    answerInput.blur();

    wrongAttempts = 0;

    result.innerHTML = "";

    answerBox.classList.add("hidden");

    if (currentMode === "write") {

        question.textContent = item.vi;

        question.className = "question";

    }

    else if (currentMode === "vocabulary") {

        question.textContent = item.han;

        question.className =
            "question question-small";

    }

    else if (currentMode === "sentence") {

        question.textContent = item.vi;

        question.className =
            "question question-small";

    }

    updateProgress();

}


/* =====================================================
   10. KIỂM TRA
===================================================== */

function checkAnswer() {

    const userAnswer =
        cleanText(answerInput.value);

    if (userAnswer === "") {

        result.innerHTML =
            '<span class="wrong">Vui lòng nhập câu trả lời.</span>';

        return;
    }

    const item =
        currentData[currentIndex];

    let correctAnswer = "";

    if (currentMode === "write") {

        correctAnswer =
            cleanText(item.han);

    }

    else if (currentMode === "vocabulary") {

        correctAnswer =
            cleanText(item.vi);

    }

    else if (currentMode === "sentence") {

        correctAnswer =
            cleanText(item.han);

    }

    if (userAnswer === correctAnswer) {

        correct++;

        total++;

        result.innerHTML =
            '<span class="correct">✓ Chính xác!</span>';

        showAnswer();

        updateStats();

        saveProgress();

        return;
    }


    /* =========================
       SAI
    ========================== */

    wrongAttempts++;

    if (wrongAttempts < 3) {

        result.innerHTML =
            '<span class="wrong">✗ Chưa đúng. Thử lại!</span>';

        /*
           Không hiện đáp án ngay.
           Không tự focus để tránh bàn phím iPhone.
        */

        updateStats();

        return;
    }


    /* =========================
       SAI 3 LẦN
    ========================== */

    wrong++;

    total++;

    result.innerHTML =
        '<span class="wrong">✗ Sai 3 lần.</span>';

    showAnswer();

    updateStats();

    saveProgress();

}


/* =====================================================
   11. HIỆN ĐÁP ÁN
===================================================== */

function showAnswer() {

    const item =
        currentData[currentIndex];

    answerBox.classList.remove("hidden");

    if (currentMode === "write") {

        answerBox.innerHTML =
            "<strong>" +
            item.han +
            "</strong>" +
            '<div class="pinyin">' +
            item.py +
            "</div>" +
            '<div class="example">' +
            item.vi +
            "</div>";

    }

    else if (currentMode === "vocabulary") {

        answerBox.innerHTML =
            "<strong>" +
            item.han +
            "</strong>" +
            '<div class="pinyin">' +
            item.py +
            "</div>" +
            '<div class="example">' +
            item.vi +
            "</div>";

    }

    else if (currentMode === "sentence") {

        answerBox.innerHTML =
            "<strong>" +
            item.han +
            "</strong>" +
            '<div class="pinyin">' +
            item.py +
            "</div>" +
            '<div class="example">' +
            item.vi +
            "</div>";

    }

}


/* =====================================================
   12. CÂU TIẾP
===================================================== */

function nextQuestion() {

    currentIndex++;

    if (currentIndex >= currentData.length) {

        currentIndex = 0;

    }

    answerInput.blur();

    showQuestion();

}


/* =====================================================
   13. LÀM SẠCH CÂU TRẢ LỜI
===================================================== */

function cleanText(text) {

    return text
        .trim()
        .toLowerCase()
        .replace(/[.,!?！？。，、；;:：]/g, "")
        .replace(/\s+/g, "");

}


/* =====================================================
   14. TRỘN CÂU
===================================================== */

function shuffleArray(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* =====================================================
   15. TRỘN MODE
===================================================== */

function shuffleCurrentMode() {

    shuffleArray(currentData);

    currentIndex = 0;

    answerInput.blur();

    showQuestion();

}


/* =====================================================
   16. THỐNG KÊ
===================================================== */

function updateStats() {

    document.getElementById("correctCount").textContent =
        correct;

    document.getElementById("wrongCount").textContent =
        wrong;

    document.getElementById("totalCount").textContent =
        total;

    let percent = 0;

    if (total > 0) {

        percent =
            Math.round(
                (correct / total) * 100
            );

    }

    document.getElementById("percentCount").textContent =
        percent + "%";

}


/* =====================================================
   17. TIẾN ĐỘ
===================================================== */

function updateProgress() {

    if (!currentData.length) {

        return;
    }

    const percent =
        ((currentIndex + 1) /
        currentData.length) * 100;

    document.getElementById("progressBar").style.width =
        percent + "%";

}


/* =====================================================
   18. RESET THỐNG KÊ
===================================================== */

function resetStatsOnly() {

    correct = 0;

    wrong = 0;

    total = 0;

    currentIndex = 0;

    wrongAttempts = 0;

    updateStats();

}


/* =====================================================
   19. RESET KẾT QUẢ
===================================================== */

function resetStats() {

    const ok =
        confirm(
            "Bạn có chắc muốn xóa kết quả học không?"
        );

    if (!ok) {

        return;
    }

    resetStatsOnly();

    localStorage.removeItem(
        "hsk_progress"
    );

    showQuestion();

}


/* =====================================================
   20. LƯU TIẾN ĐỘ
===================================================== */

function saveProgress() {

    const data = {

        name: studentName,

        level: selectedLevel,

        correct: correct,

        wrong: wrong,

        total: total,

        mode: currentMode,

        time: Date.now()

    };

    localStorage.setItem(
        "hsk_progress",
        JSON.stringify(data)
    );

}


/* =====================================================
   21. ENTER
===================================================== */

answerInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            checkAnswer();

            answerInput.blur();

        }

    }
);


/* =====================================================
   22. KHÔNG TỰ BẬT BÀN PHÍM IPHONE
===================================================== */

window.addEventListener(
    "load",
    function() {

        document.activeElement?.blur();

        const savedName =
            localStorage.getItem(
                "hsk_student_name"
            );

        const savedLevel =
            localStorage.getItem(
                "hsk_level"
            );

        if (savedName) {

            studentNameInput.value =
                savedName;

        }

        if (savedLevel) {

            selectLevel(
                Number(savedLevel)
            );

        }

    }
);

</script>
